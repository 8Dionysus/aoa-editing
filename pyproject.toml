[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "aoa-editing"
version = "0.2.0"
description = "Local-first, evidence-backed AI video co-editor"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "8Dionysus"}]
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "opencv-python-headless>=5.0,<6",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
interchange = [
  "opentimelineio>=0.17,<1",
]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
aoa-editing = "aoa_editing.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aoa_editing"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: crosses a process or filesystem adapter boundary",
  "e2e: runs a full product workflow",
  "heavy: resource-gated media or AI workload",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aoa_editing"]

[tool.coverage.run]
branch = true
source = ["aoa_editing"]
